# Environment the paper results were computed with (Linux, CUDA 12.8).
#   conda env create -f environment.yml && conda activate gnn-gym
#   pip install -e ".[oracle,test]"
# The uMLIP checkpoint (uma-s-1p1) is downloaded by fairchem from Hugging
# Face on first use and requires accepting its licence there.
name: gnn-gym
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.8.0
      - numpy==2.1.2
      - scipy==1.15.3
      - pyyaml==6.0.2
      - pandas==2.3.1
      - matplotlib==3.10.3
      - ase==3.28.0
      - fairchem-core==2.14.0
      - matscipy==1.2.0
      - pytest
