# Pure Mo, Nb, Ta, W, second realisation (see pure_s0.yaml).
#   python -m gnn_gym.kmc.campaign configs/kmc/pure_s1.yaml
#
# Seeds are base 1007 + T + an offset per element (Mo 0, Nb 100, Ta 200,
# W 300); the same four pairs of points share a seed as in pure_s0.yaml.
campaign:
  runs_dir: runs/pure_s1
  de_model: models/MoNbTaW/de_L2_s0.pt
  bsym_model: models/MoNbTaW/bsym_site_s0.pt

defaults:
  supercell_size: 12
  n_steps: 500000
  attempt_frequency_Hz: 1.0e+13
  escape: true
  escape_params: {revisit_threshold: 3, window: 200, internal_n_kT: 1.0,
                  max_basin_size: 100, cooldown_steps: 25}
  snapshot_every: 500
  checkpoint_every: 2000
  progress_every: 5000

points:
  - {system: Mo, T_K: 1100, seed: 2107}
  - {system: Mo, T_K: 1300, seed: 2307}
  - {system: Mo, T_K: 1500, seed: 2507}
  - {system: Nb, T_K: 1100, seed: 2207}
  - {system: Nb, T_K: 1300, seed: 2407}
  - {system: Nb, T_K: 1500, seed: 2607}
  - {system: Ta, T_K: 1100, seed: 2307}
  - {system: Ta, T_K: 1300, seed: 2507}
  - {system: Ta, T_K: 1500, seed: 2707}
  - {system: W, T_K: 1100, seed: 2407}
  - {system: W, T_K: 1300, seed: 2607}
  - {system: W, T_K: 1500, seed: 2807}
