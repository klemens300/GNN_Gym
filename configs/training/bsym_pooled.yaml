# Barrier model with the pooled read-out: site features are averaged over
# the read-out ball first and the head runs once on the mean. Comparison
# model of the paper (shipped as models/MoNbTaW/bsym_pooled_s0.pt; retraining
# writes to runs/models); everything else as
# in bsym_site.yaml except the epoch limit, which was 120 for this run.
#   python -m gnn_gym.training.train configs/training/bsym_pooled.yaml
model:
  target: bsym
  elements: [Mo, Nb, Ta, W]
  lattice: bcc
  size: 7
  shells: [1, 2]
  bsym_layers: 2
  bsym_hidden: 128
  bsym_pool_hops: 2
  bsym_head_hidden: [256, 128]
  bsym_line_graph: true
  bsym_site_sum: false

training:
  train_csv: data/jumps/MoNbTaW_7cube_train.csv
  referee_csv: data/jumps/MoNbTaW_7cube_referee.csv
  out_dir: runs/models
  run_name: bsym_pooled_s0
  batch_size: 64
  epochs: 120
  lr: 1.0e-3
  weight_decay: 1.0e-6
  lr_factor: 0.5
  lr_patience: 12
  patience: 40
  huber_delta_meV: 50.0
  grad_clip: 5.0
  val_frac: 0.1
  seed: 0
