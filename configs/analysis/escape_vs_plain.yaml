# Escape layer against plain BKL KMC (Results, diffusion; SI table): the runs
# of configs/kmc/escape_local.yaml and configs/kmc/no_escape.yaml share seed,
# start configuration and random-number stream. Compared over the 5e5 steps
# of the plain runs; the 700 and 900 K escape runs are cut there.
#   python -m gnn_gym.analysis.escape_vs_plain configs/analysis/escape_vs_plain.yaml
n_steps: 500000
pairs:
  - {escape: runs/escape_local/kmc_MoNbTaW_T700, plain: runs/no_escape/kmc_MoNbTaW_T700}
  - {escape: runs/escape_local/kmc_MoNbTaW_T900, plain: runs/no_escape/kmc_MoNbTaW_T900}
  - {escape: runs/escape_local/kmc_MoNbTaW_T1100, plain: runs/no_escape/kmc_MoNbTaW_T1100}
out: results/kmc/escape_vs_plain.csv
